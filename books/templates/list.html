{% extends 'base.html' %}
{% block content %}
<h2>All Books</h2>
<table border ="1">
<tr>
    <th>Book ID</th>
    <th>Book Name</th>
    <th>Author</th>
    <th>Category</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Actions</th>
</tr>

{% for b in books %}

<tr>
    <td>{{ b.book_id }}</td>
    <td>{{ b.book_name }}</td>
    <td>{{ b.author }}</td>
    <td>{{ b.category }}</td>
    <td>{{ b.price }}</td>
    <td>{{ b.quantity }}</td>
    <td>
        <a href = "{% url 'edit' b.book_id %}">Edit</a>
        <a href = "{% url 'delete' b.book_id %}">Delete</a>
    </td>
</tr>
{% endfor %}
</table>
{% endblock %}
